plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    def appKeyProps = file('key.properties')
    if (appKeyProps.exists()) {
        keystoreProperties.load(new FileInputStream(appKeyProps))
    }
}

def releaseKeystorePath = System.getenv("KEYSTORE_FILE") ?: System.getenv("KEYSTORE_PATH") ?: keystoreProperties['storeFile']
def releaseStorePassword = System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties['storePassword']
def releaseKeyAlias = System.getenv("KEY_ALIAS") ?: keystoreProperties['keyAlias']
def releaseKeyPassword = System.getenv("KEY_PASSWORD") ?: keystoreProperties['keyPassword']

android {
    namespace = "com.traderlog.traderlog"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = "com.traderlog.traderlog"
        minSdk = 21
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (releaseKeystorePath && file(releaseKeystorePath).exists()) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else {
                // Fallback for local testing builds when release secrets are not configured
                def debugKeystore = file("${System.getProperty('user.home')}/.android/debug.keystore")
                if (debugKeystore.exists()) {
                    storeFile debugKeystore
                }
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }
}


flutter {
    source = "../.."
}
