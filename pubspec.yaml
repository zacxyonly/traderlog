name: traderlog
description: "Traderlog - Jurnal Trading Profesional untuk Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  image_picker: ^1.1.2
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  csv: ^6.0.0
  local_auth: ^2.3.0
  crypto: ^3.0.3
  archive: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A111C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

