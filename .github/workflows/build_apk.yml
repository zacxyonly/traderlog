name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Opsional: isi tag rilis (mis. v1.0.0) untuk membuat GitHub Release. Kosongkan untuk build saja.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Decode release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.TRADERLOG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TRADERLOG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRADERLOG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRADERLOG_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]   && missing="$missing TRADERLOG_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing TRADERLOG_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing TRADERLOG_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing TRADERLOG_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Secrets:$missing. Run tools/generate_keystore.sh and add them (see README, 'Signing')."
            exit 1
          fi
          # Keep the keystore outside the workspace so it can never be committed or uploaded.
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TRADERLOG_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "TRADERLOG_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TRADERLOG_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TRADERLOG_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify APK is signed with the release key
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee apk-cert.txt
          if grep -qi "Android Debug" apk-cert.txt; then
            echo "::error::APK is signed with the DEBUG key."
            exit 1
          fi
          rm -f apk-cert.txt

      - name: Rename APK for clarity
        run: |
          mkdir -p release-output
          TAG_NAME="${{ inputs.release_tag }}"
          TAG_NAME="${TAG_NAME:-build-${GITHUB_RUN_NUMBER}}"
          cp build/app/outputs/flutter-apk/app-release.apk "release-output/TraderLog-${TAG_NAME}.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraderLog-Release-APK
          path: release-output/TraderLog-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: release-output/TraderLog-*.apk
          generate_release_notes: true
