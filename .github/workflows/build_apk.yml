name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (lints)
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Configure Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release-keystore.jks
            echo "KEYSTORE_PATH=/tmp/release-keystore.jks" >> $GITHUB_ENV
          else
            echo "No KEYSTORE_BASE64 secret provided. Proceeding with fallback."
          fi

      - name: Build Android Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Package Release APKs
        run: |
          mkdir -p release-output
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          if [ -f build/app/outputs/flutter-apk/app-universal-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-universal-release.apk "release-output/TraderLog-${TAG_NAME}-universal.apk"
          fi
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "release-output/TraderLog-${TAG_NAME}.apk"
          fi
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            if [ -f "$apk" ]; then
              base=$(basename "$apk" -release.apk)
              if [ "$base" != "app" ] && [ "$base" != "app-universal" ]; then
                cp "$apk" "release-output/TraderLog-${TAG_NAME}-${base}.apk"
              fi
            fi
          done
          ls -la release-output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraderLog-Release-APK
          path: release-output/TraderLog-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/TraderLog-*.apk
          name: "TraderLog ${{ github.ref_name }}"
          generate_release_notes: true

