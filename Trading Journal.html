<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Journal</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#0d1b2a;--mu:#6b7a90;--bd:#e5e9f0;--soft:#eef2f7;--ac:#10b981;--acd:#059669;--rd:#ef4444;--sh:0 1px 2px rgba(13,27,42,.04),0 8px 24px rgba(13,27,42,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a111c;--card:#121b2b;--tx:#e8edf5;--mu:#8b9ab0;--bd:#1f2b40;--soft:#1a2539;--acd:#34d399;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0a111c;--card:#121b2b;--tx:#e8edf5;--mu:#8b9ab0;--bd:#1f2b40;--soft:#1a2539;--acd:#34d399;--sh:0 8px 24px rgba(0,0,0,.35)}
html,body{height:100%;margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{height:100%;overflow-y:auto;padding:12px 14px 130px;max-width:560px;margin:0 auto}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:26px;padding:18px 18px 0;background:linear-gradient(150deg,#0b1b2b 0%,#0e3b36 100%);box-shadow:var(--sh);margin-bottom:14px}
.hero .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8fe3c3}
.hero .lbl{margin-top:14px;font-size:12px;color:#9fb4c4}
.hero .big{font-size:34px;font-weight:750;letter-spacing:-.02em;line-height:1.15}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px;font-size:13px;color:#c5d3de}
.pill{padding:3px 10px;border-radius:99px;font-weight:700;font-size:12px;background:rgba(255,255,255,.12)}
.hero svg{display:block;margin:6px -18px 0;width:calc(100% + 36px)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.lab{font-size:12px;color:var(--mu);font-weight:600}
.val{font-size:20px;font-weight:750;letter-spacing:-.01em}
.up{color:var(--acd)}.dn{color:var(--rd)}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px}
.b-win{background:rgba(16,185,129,.15);color:var(--acd)}.b-lose{background:rgba(239,68,68,.14);color:var(--rd)}.b-be{background:rgba(217,119,6,.16);color:#d97706}
.t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:var(--mu);font-size:12.5px;margin-top:4px}
.trade{cursor:pointer;border-left:4px solid var(--bd);transition:transform .12s}
.trade:active{transform:scale(.985)}
.trade.win{border-left-color:var(--ac)}.trade.lose{border-left-color:var(--rd)}.trade.be{border-left-color:#d97706}
.side{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:6px}
.side.BUY{background:rgba(16,185,129,.15);color:var(--acd)}.side.SELL{background:rgba(239,68,68,.14);color:var(--rd)}
.mon{display:flex;justify-content:space-between;margin:16px 4px 8px;font-size:13px;font-weight:700;color:var(--mu)}
.search{position:relative;margin-bottom:8px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mu)}
.search input{padding-left:40px}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:14px;margin-bottom:12px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;border:0;background:none;color:var(--mu);font-weight:700;font-size:13px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sd{display:flex;gap:8px;margin-bottom:0}.sd button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font-weight:800;font-size:15px}
.sd button.on.b{background:var(--ac);color:#fff;border-color:var(--ac)}.sd button.on.s{background:var(--rd);color:#fff;border-color:var(--rd)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 28px));display:flex;gap:4px;padding:6px;border-radius:24px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);box-shadow:0 10px 30px rgba(13,27,42,.18);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font-weight:700;font-size:11.5px;padding:8px 0 6px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .2s,color .2s}
nav button.on{background:rgba(16,185,129,.14);color:var(--acd)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:20px;border:0;background:linear-gradient(135deg,#34d399,#059669);color:#fff;box-shadow:0 10px 22px rgba(5,150,105,.4);display:grid;place-items:center;z-index:4}
.fab svg{width:26px;height:26px;stroke-width:2.4}
.sheet{position:fixed;inset:0;background:rgba(5,10,20,.55);display:none;align-items:flex-end;z-index:9}
.sheet.show{display:flex}.sheet.show .panel{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.panel{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
label{display:block;font-size:12.5px;color:var(--mu);font-weight:600;margin:12px 0 5px}
input,select,textarea{width:100%;font-size:16px;font-family:inherit;padding:12px 13px;border:1px solid var(--bd);border-radius:13px;background:var(--soft);color:var(--tx)}
input[type=file]{display:none}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:800;font-size:16px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.g{background:var(--soft);color:var(--tx);border:1px solid var(--bd);margin-top:8px}
.btn.r{color:var(--rd)}
.btn svg{width:19px;height:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:var(--soft);border:1px solid var(--bd);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--tx)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.bar{height:7px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:4px}
.li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.li:last-child{border:0}
.sec{margin:18px 4px 8px;font-size:13px;font-weight:700;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:36px 10px}.empty svg{width:44px;height:44px;opacity:.5;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#0d1b2a;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="fab" aria-label="Tambah trade"></button>
<nav id="nav">
<button data-t="log"></button><button data-t="sum"></button><button data-t="set"></button>
</nav>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div id="toast" role="status"></div>
<script>
const KEY="tj_mobile_v1";
const def={cap:1000,fx:17998,theme:"auto",syms:["XAU/USD","EUR/USD","GBP/USD","USD/JPY","BTC/USD","ETH/USD","USTEC","US30","US500"],trades:[]};
let S=def,tab="log",side="BUY",editId=null,flt="ALL",per="all",q="",pending="",pendingName="";
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign({},def,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Gagal menyimpan di browser. Ekspor CSV untuk cadangan")}};
const $=s=>document.querySelector(s);
const P=d=>`<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const IC={
 log:P('<path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18M10 8h5M10 12h5M10 16h3"/>'),
 sum:P('<path d="M5 20V11M12 20V4M19 20v-6"/>'),
 set:P('<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/>'),
 plus:P('<path d="M12 5v14M5 12h14"/>'),
 dl:P('<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/>'),
 ul:P('<path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 20h14"/>'),
 srch:P('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/>')
};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=n=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const pc=n=>(n*100).toFixed(2)+"%";
const cls=n=>n>0?"up":n<0?"dn":"";
const fd=d=>new Date(d).toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),2600)}
function rrn(t){const e=+t.entry,s=+t.sl,p=+t.tp;return(e&&s&&p&&e!==s)?Math.abs(p-e)/Math.abs(e-s):0}
const rr=t=>rrn(t)?"1:"+rrn(t).toFixed(2):"-";
function calc(){let eq=+S.cap;const L=[...S.trades].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>{const bal=eq;eq+=+t.pl;return{...t,bal,eq,res:t.pl>0?"WIN":t.pl<0?"LOSE":"BE",chg:bal?t.pl/bal:0}});return{L,eq}}
function spark(p,H,id){if(p.length<2)return"";const mn=Math.min(...p),mx=Math.max(...p),rg=(mx-mn)||1,W=300;
 const l=p.map((v,i)=>(i/(p.length-1)*W).toFixed(1)+","+(H-6-(v-mn)/rg*(H-14)).toFixed(1)).join(" "),c=p[p.length-1]>=p[0]?"#34d399":"#f87171";
 return`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" height="${H}"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".4"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><polygon points="0,${H} ${l} ${W},${H}" fill="url(#${id})"/><polyline points="${l}" fill="none" stroke="${c}" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
function theme(){const r=document.documentElement;S.theme==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",S.theme)}

function render(){
 theme();
 document.querySelectorAll("nav button").forEach(b=>{const t=b.dataset.t;b.classList.toggle("on",t===tab);b.innerHTML=IC[t]+({log:"Jurnal",sum:"Ringkasan",set:"Atur"})[t]});
 $("#fab").innerHTML=IC.plus;$("#fab").style.display=tab==="log"?"grid":"none";
 const{L,eq}=calc(),pl=eq-S.cap;
 let h=`<div class="hero"><div class="top"><span>by Zacxy</span><span>Trading Journal</span></div>
 <div class="lbl">Total akun</div><div class="big">${m(eq)}</div>
 <div class="meta"><span>Rp ${Math.round(eq*S.fx).toLocaleString("id-ID")}</span><span class="pill" style="color:${pl>=0?"#6ee7b7":"#fca5a5"}">${pl>=0?"+":""}${m(pl)} · ${pc(S.cap?pl/S.cap:0)}</span></div>
 ${L.length>1?spark([+S.cap,...L.map(t=>t.eq)],56,"hg"):'<div style="height:14px"></div>'}</div>`;
 if(tab==="log")h+=`<div class="search">${IC.srch}<input id="q" type="search" placeholder="Cari symbol atau alasan" value="${esc(q)}"></div>
  <div class="seg">${["ALL","WIN","LOSE","BE"].map(f=>`<button data-f="${f}" class="${flt===f?"on":""}">${f==="ALL"?"Semua":f}</button>`).join("")}</div><div id="list">${listHTML()}</div>`;
 if(tab==="sum")h+=summary(L,eq);
 if(tab==="set")h+=settings();
 $("#app").innerHTML=h;
}
function listHTML(){
 const{L}=calc();if(!L.length)return`<div class="empty">${IC.log}<br>Belum ada trade.<br>Tekan tombol + untuk mencatat trade pertama.</div>`;
 const k=q.trim().toLowerCase(),V=[...L].reverse().filter(t=>(flt==="ALL"||t.res===flt)&&(!k||(t.sym+" "+(t.why||"")+" "+(t.note||"")).toLowerCase().includes(k)));
 if(!V.length)return`<div class="empty">Tidak ada trade yang cocok dengan filter.</div>`;
 const mk=t=>new Date(t.date).toLocaleDateString("id-ID",{month:"long",year:"numeric"});
 const tot={};V.forEach(t=>tot[mk(t)]=(tot[mk(t)]||0)+ +t.pl);
 let h="",cur="";
 V.forEach(t=>{const n=L.findIndex(x=>x.id===t.id)+1,c=t.res.toLowerCase(),mo=mk(t);
  if(mo!==cur){cur=mo;h+=`<div class="mon"><span>${mo}</span><span class="${cls(tot[mo])}">${m(tot[mo])}</span></div>`}
  h+=`<div class="card trade ${c}" data-id="${t.id}"><div class="t"><div><b>#${n} ${esc(t.sym)}</b><span class="side ${t.side}">${t.side}</span></div><span class="badge b-${c}">${t.res}</span></div>
  <div class="t" style="margin-top:6px"><div class="val ${cls(t.pl)}">${m(+t.pl)}</div><div class="sub" style="margin:0">${pc(t.chg)} · RR ${rr(t)}</div></div>
  <div class="sub">${fd(t.date)} · Equity ${m(t.eq)}${t.lot?" · "+esc(t.lot)+" lot":""}</div>
  ${t.why?`<div class="sub" style="color:var(--tx)">${esc(t.why)}</div>`:""}</div>`});
 return h}

function summary(AL,eq){
 const L=per==="all"?AL:AL.filter(t=>new Date(t.date)>=Date.now()-per*864e5);
 let h=`<div class="seg">${[["all","Semua"],["30","30 hari"],["7","7 hari"]].map(([v,l])=>`<button data-p="${v}" class="${per===v?"on":""}">${l}</button>`).join("")}</div>`;
 if(!L.length)return h+`<div class="empty">${IC.sum}<br>Belum ada trade pada periode ini.</div>`;
 const n=L.length,W=L.filter(t=>t.res==="WIN"),Lo=L.filter(t=>t.res==="LOSE"),be=n-W.length-Lo.length;
 const gp=W.reduce((a,t)=>a+ +t.pl,0),gl=Lo.reduce((a,t)=>a+ +t.pl,0),pl=gp+gl;
 const pf=gl?(gp/Math.abs(gl)).toFixed(2):(gp?"∞":"-"),wr=W.length/n;
 const pls=L.map(t=>+t.pl),best=Math.max(...pls),worst=Math.min(...pls);
 const pts=[L[0].bal,...L.map(t=>t.eq)];let pk=pts[0],dd=0;pts.forEach(v=>{pk=Math.max(pk,v);if(pk>0)dd=Math.max(dd,(pk-v)/pk)});
 let st=0,sr="";for(let i=n-1;i>=0;i--){const r=L[i].res;if(r==="BE")break;if(!sr)sr=r;if(r!==sr)break;st++}
 const rs=L.map(rrn).filter(Boolean),arr=rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:0;
 h+=`<div class="grid"><div class="card"><div class="lab">Total trade</div><div class="val">${n}</div></div><div class="card"><div class="lab">Win rate</div><div class="val">${pc(wr)}</div><div class="bar"><i style="width:${wr*100}%;background:var(--ac)"></i></div></div>
 <div class="card"><div class="lab">Profit / loss</div><div class="val ${cls(pl)}">${m(pl)}</div></div><div class="card"><div class="lab">Profit factor</div><div class="val">${pf}</div></div></div>`;
 if(n>1)h+=`<div class="card" style="margin-top:10px"><div class="lab">Kurva equity</div><div style="margin-top:8px">${spark(pts,110,"sg")}</div></div>`;
 const row=(a,b,c="")=>`<div class="li"><span>${a}</span><b class="${c}">${b}</b></div>`;
 h+=`<div class="card" style="margin-top:10px">${row("Win / Break even / Loss",`${W.length} / ${be} / ${Lo.length}`)}${row("Rata-rata win",m(W.length?gp/W.length:0),"up")}${row("Rata-rata loss",m(Lo.length?gl/Lo.length:0),Lo.length?"dn":"")}
 ${row("Expectancy per trade",m(pl/n),cls(pl))}${row("Trade terbaik",m(best),cls(best))}${row("Trade terburuk",m(worst),cls(worst))}${row("Max drawdown",pc(dd),dd?"dn":"")}${row("Rata-rata RR",arr?"1:"+arr.toFixed(2):"-")}${row("Streak saat ini",st?st+" "+(sr==="WIN"?"win":"loss"):"-",sr==="WIN"?"up":sr==="LOSE"?"dn":"")}</div>
 <div class="sec">Per symbol</div>`;
 const by=[...new Set(L.map(t=>t.sym))].map(s=>{const x=L.filter(t=>t.sym===s);return{s,n:x.length,w:x.filter(t=>t.res==="WIN").length,p:x.reduce((a,t)=>a+ +t.pl,0)}}).filter(x=>x.n).sort((a,b)=>b.p-a.p);
 const mxp=Math.max(1,...by.map(x=>Math.abs(x.p)));
 by.forEach(x=>h+=`<div class="card"><div class="t"><b>${esc(x.s)}</b><b class="${cls(x.p)}">${m(x.p)}</b></div><div class="sub">${x.n} trade · win rate ${pc(x.w/x.n)}</div><div class="bar"><i style="width:${Math.abs(x.p)/mxp*100}%;background:${x.p>=0?"var(--ac)":"var(--rd)"}"></i></div></div>`);
 return h}

function settings(){
 return`<div class="card"><label style="margin-top:0">Modal awal (USD)</label><input id="cap" type="number" inputmode="decimal" step="any" value="${S.cap}">
 <label>Kurs IDR per 1 USD</label><input id="fx" type="number" inputmode="decimal" step="any" value="${S.fx}">
 <label>Tema</label><div class="seg" style="margin:0">${[["auto","Otomatis"],["light","Terang"],["dark","Gelap"]].map(([v,l])=>`<button data-th="${v}" class="${S.theme===v?"on":""}">${l}</button>`).join("")}</div></div>
 <div class="card"><div class="lab">Daftar symbol</div><div class="chips">${S.syms.map(s=>`<button class="chip" data-rm="${esc(s)}" aria-label="Hapus ${esc(s)}">${esc(s)} ✕</button>`).join("")}</div>
 <div class="row"><input id="ns" placeholder="Symbol baru, mis. NAS100" autocapitalize="characters"><button class="btn" id="addS" style="margin:0;flex:0 0 90px">Tambah</button></div></div>
 <div class="card"><div class="lab">Data (CSV)</div><div class="sub">Data disimpan di browser perangkat ini. Ekspor ke file CSV untuk cadangan atau dibuka di Excel, lalu impor kembali kapan saja.</div>
 <button class="btn" id="exp">${IC.dl}Ekspor CSV</button>
 <label class="btn g" for="csvFile" style="margin-top:8px;font-size:16px;color:var(--tx);cursor:pointer">${IC.ul}Impor CSV</label><input id="csvFile" type="file" accept=".csv,text/csv,text/plain">
 <div class="sub" id="impMsg"></div>
 <div id="impAct" style="display:none"><button class="btn" id="impMerge">Gabungkan dengan data ini</button><button class="btn g" id="impReplace">Ganti semua data</button></div>
 <button class="btn g r" id="reset" style="margin-top:18px">Hapus semua trade</button></div>`}

function openForm(id){
 editId=id||null;const t=S.trades.find(x=>x.id===id)||{};side=t.side||"BUY";
 const now=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
 const f=(k,l,ph="")=>`<div><label>${l}</label><input id="f_${k}" type="number" inputmode="decimal" step="any" value="${esc(t[k])}" placeholder="${ph}"></div>`;
 $("#panel").innerHTML=`<div class="t"><b style="font-size:19px">${id?"Edit trade":"Trade baru"}</b><button id="x" aria-label="Tutup" style="border:0;background:none;color:var(--mu);font-size:24px">✕</button></div>
 <label>Tanggal &amp; waktu</label><input id="f_date" type="datetime-local" value="${t.date||now}">
 <label>Symbol</label><select id="f_sym">${(t.sym&&!S.syms.includes(t.sym)?[t.sym,...S.syms]:S.syms).map(s=>`<option ${s===t.sym?"selected":""}>${esc(s)}</option>`).join("")}</select>
 <label>Posisi</label><div class="sd"><button class="b" data-s="BUY">BUY</button><button class="s" data-s="SELL">SELL</button></div>
 <div class="row">${f("entry","Entry")}${f("lot","Lot size")}</div><div class="row">${f("sl","Stop loss")}${f("tp","Take profit")}</div>
 <div class="sub" id="rr"></div>
 ${f("pl","Profit / loss (USD, loss pakai minus)","mis. 90 atau -50").replace(' inputmode="decimal"',"")}
 <label>Alasan ambil trade</label><textarea id="f_why" rows="2">${esc(t.why||"")}</textarea>
 <label>Catatan / link screenshot</label><textarea id="f_note" rows="2">${esc(t.note||"")}</textarea>
 <button class="btn" id="saveT">Simpan trade</button>${id?`<button class="btn g r" id="delT">Hapus trade</button>`:""}`;
 $("#sheet").classList.add("show");sideUI();rrUI()}
const sideUI=()=>document.querySelectorAll(".sd button").forEach(b=>b.classList.toggle("on",b.dataset.s===side));
const rrUI=()=>{const g=k=>$("#f_"+k)?.value;if($("#rr"))$("#rr").textContent="Risk to reward: "+rr({entry:g("entry"),sl:g("sl"),tp:g("tp")})};
const close=()=>$("#sheet").classList.remove("show");

function ask(msg,fn){const o=document.createElement("div");o.className="sheet show";o.style.zIndex=30;o.style.alignItems="center";
 o.innerHTML=`<div class="panel" style="border-radius:22px;max-width:340px;margin:auto;text-align:center"><div style="font-weight:700;line-height:1.4">${esc(msg)}</div><button class="btn" data-y>Ya</button><button class="btn g" data-n>Batal</button></div>`;
 o.onclick=e=>{e.stopPropagation();const y=e.target.closest("[data-y]");if(y||e.target.closest("[data-n]")||e.target===o){o.remove();if(y)fn()}};document.body.appendChild(o)}
function exportCSV(){
 const L=calc().L;if(!L.length)return toast("Belum ada trade untuk diekspor");
 const sf=v=>/^[=+\-@\t\r]/.test(String(v??""))?"'"+v:v;
 const qt=v=>{v=String(v??"");return/[",;\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const csv="\uFEFF"+["No,Date,Symbol,Side,Entry,SL,TP,Lot,RR,Result,PL,Equity,Why,Note",...L.map((t,i)=>[i+1,t.date,t.sym,t.side,t.entry,t.sl,t.tp,t.lot,rr(t),t.res,t.pl,t.eq.toFixed(2),sf(t.why),sf(t.note)].map(qt).join(","))].join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
 a.download="trading-journal-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast(L.length+" trade diekspor ke CSV")}

document.addEventListener("click",e=>{
 const el=e.target.closest("[data-t],[data-id],[data-s],[data-rm],[data-f],[data-p],[data-th],button,.sheet");if(!el)return;
 const d=el.dataset;
 if(d.t){tab=d.t;render();$("#app").scrollTop=0;return}
 if(d.f){flt=d.f;render();return}
 if(d.p){per=d.p;render();return}
 if(d.th){S.theme=d.th;save();render();return}
 if(el.id==="fab")return openForm();
 if(d.id&&!el.closest(".sheet"))return openForm(d.id);
 if(el.classList.contains("sheet")&&e.target===el)return close();
 if(el.id==="x")return close();
 if(d.s){side=d.s;return sideUI()}
 if(el.id==="saveT"){
  const g=k=>$("#f_"+k).value;
  if(g("pl")===""||!g("date")){toast("Isi tanggal dan profit/loss dulu");return}
  const t={id:editId||String(Date.now()),date:g("date"),sym:g("sym"),side,entry:g("entry"),sl:g("sl"),tp:g("tp"),lot:g("lot"),pl:+g("pl"),why:g("why"),note:g("note")};
  S.trades=editId?S.trades.map(x=>x.id===editId?t:x):[...S.trades,t];save();close();render();toast("Trade disimpan");return}
 if(el.id==="delT"){const id=editId;ask("Hapus trade ini?",()=>{S.trades=S.trades.filter(x=>x.id!==id);save();close();render();toast("Trade dihapus")});return}
 if(d.rm){const r=d.rm;ask("Hapus symbol "+r+"? (trade lama tetap aman)",()=>{S.syms=S.syms.filter(s=>s!==r);save();render()});return}
 if(el.id==="addS"){const v=$("#ns").value.trim().toUpperCase();if(v&&!S.syms.includes(v)){S.syms.push(v);save();render()}return}
 if(el.id==="reset"){ask("Hapus SEMUA trade? Ekspor CSV dulu bila perlu cadangan.",()=>{S.trades=[];save();render();toast("Semua trade dihapus")});return}
 if(el.id==="exp")return exportCSV();
 if(el.id==="impMerge"||el.id==="impReplace")return doImport(pending,el.id==="impReplace");
});
function parseCSV(t){
 t=t.replace(/^\uFEFF/,"");const l0=t.split(/\r?\n/)[0]||"",d=l0.split(";").length>l0.split(",").length?";":",";
 const rows=[];let r=[],c="",qq=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(qq){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else qq=false}else c+=ch}
  else if(ch==='"')qq=true;
  else if(ch===d){r.push(c);c=""}
  else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);c="";if(r.some(x=>x.trim()!==""))rows.push(r);r=[]}
  else c+=ch}
 r.push(c);if(r.some(x=>x.trim()!==""))rows.push(r);return rows}
function doImport(text,replace){
 const msg=$("#impMsg"),rows=parseCSV(text||"");
 if(rows.length<2){msg.textContent="CSV kosong atau tidak valid.";return}
 const alias={date:["date","date and time","tanggal"],sym:["symbol","symbol/pair","pair"],side:["side","buy/sell","posisi"],entry:["entry"],sl:["sl","stop loss"],tp:["tp","take profit"],lot:["lot","lot size"],pl:["pl","profit or loss","profit/loss","profit"],why:["why","alasan","alasan ambil trade"],note:["note","trade note","catatan"]};
 const h=rows[0].map(x=>x.trim().toLowerCase()),ix={};
 for(const k in alias)ix[k]=h.findIndex(x=>alias[k].includes(x));
 if(ix.date<0||ix.pl<0){msg.textContent="Header harus punya kolom Date dan PL (Profit or Loss).";return}
 const g=(r,k)=>ix[k]>=0?(r[ix[k]]??"").trim().replace(/^'(?=[=+\-@])/,""):"";
 const num=v=>{v=String(v).replace(/[$\s]/g,"").replace(/^\((.*)\)$/,"-$1");if(v==="")return NaN;
  if(v.includes(",")&&v.includes("."))v=v.lastIndexOf(",")>v.lastIndexOf(".")?v.replace(/\./g,"").replace(",","."):v.replace(/,/g,"");else v=v.replace(",",".");return Number(v)};
 const nv=v=>{const n=num(v);return isNaN(n)?"":String(n)};
 const pd=s=>{let a,y,mo,d,h=0,mi=0;
  if(a=s.match(/^(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})(?:[ T]+(\d{1,2}):(\d{2}))?/)){[,y,mo,d,h=0,mi=0]=a}
  else if(a=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})(?:[ T]+(\d{1,2}):(\d{2}))?/)){[,d,mo,y,h=0,mi=0]=a}
  else return null;
  y=+y;mo=+mo;d=+d;h=+h;mi=+mi;const t=new Date(y,mo-1,d,h,mi);
  if(t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d||h>23||mi>59)return null;
  const z=n=>String(n).padStart(2,"0");return`${y}-${z(mo)}-${z(d)}T${z(h)}:${z(mi)}`};
 const exist=new Set(replace?[]:S.trades.map(t=>[t.date,t.sym,+t.pl,+t.entry||0].join("|")));
 const add=[];let skip=0,dup=0,i0=Date.now();
 rows.slice(1).forEach((r,i)=>{
  const ds2=pd(g(r,"date")),pl=num(g(r,"pl"));
  if(!ds2||isNaN(pl)){skip++;return}
  const sym=g(r,"sym").toUpperCase()||"-",sd=g(r,"side").toUpperCase()==="SELL"?"SELL":"BUY",entry=nv(g(r,"entry"));
  const key=[ds2,sym,pl,+entry||0].join("|");if(exist.has(key)){dup++;return}exist.add(key);
  add.push({id:i0+"-"+i,date:ds2,sym,side:sd,entry,sl:nv(g(r,"sl")),tp:nv(g(r,"tp")),lot:nv(g(r,"lot")),pl,why:g(r,"why"),note:g(r,"note")})});
 if(!add.length){msg.textContent=`Tidak ada trade baru. Dilewati: ${skip} tidak valid, ${dup} duplikat.`;return}
 const go=()=>{S.trades=replace?add:[...S.trades,...add];
  add.forEach(t=>{if(t.sym!=="-"&&!S.syms.includes(t.sym))S.syms.push(t.sym)});
  pending="";save();render();toast(`${add.length} trade diimpor · ${skip} tidak valid · ${dup} duplikat`)};
 if(replace&&S.trades.length)ask("Semua trade saat ini akan diganti. Lanjut?",go);else go()}
document.addEventListener("input",e=>{
 const i=e.target.id;
 if(["f_entry","f_sl","f_tp"].includes(i))rrUI();
 if(i==="q"){q=e.target.value;$("#list").innerHTML=listHTML()}
 if(i==="cap"){S.cap=+e.target.value||0;save()}
 if(i==="fx"){S.fx=+e.target.value||0;save()}
});
document.addEventListener("change",e=>{
 if(e.target.id==="cap"||e.target.id==="fx")render();
 if(e.target.id==="csvFile"&&e.target.files[0]){const f=e.target.files[0],rd=new FileReader();
  rd.onload=()=>{pending=rd.result;const n=Math.max(0,parseCSV(pending).length-1);$("#impMsg").textContent=`${f.name}: ${n} baris terbaca. Pilih cara impor.`;$("#impAct").style.display="block"};
  rd.onerror=()=>{$("#impMsg").textContent="Gagal membaca file. Coba pilih ulang file CSV."};rd.readAsText(f)}
});
render();
</script>
